spring.application.name=carebridge-backend

# Database Configuration with Local Fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carebridge_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chetan}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Chetan123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=${PORT:8080}

# ML Service Configuration with Local Fallback
ml.service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}